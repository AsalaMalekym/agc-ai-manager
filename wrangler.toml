name = "vkgropwithgpt"
main = "worker.js"
compatibility_date = "2026-07-30"
keep_vars = true

[vars]
ENVIRONMENT = "production"
DRY_RUN = "off"
AUTO_POST = "on"
AUTO_FACTS = "on"
AUTO_MIXED = "on"
GENERATE_IMAGES = "on"
AUTO_REPLY = "on"
COMMENT_REPLY = "on"
MODERATION = "on"
AUTO_DELETE = "on"
MAX_AI_CALLS_PER_DAY = "2000"

[[durable_objects.bindings]]
name = "MANAGER"
class_name = "ManagerState"

[[migrations]]
tag = "v3-manager"
new_sqlite_classes = ["ManagerState"]

[ai]
binding = "AI"

[triggers]
crons = ["* * * * *", "30 20 * * *"]

[observability]
enabled = true
